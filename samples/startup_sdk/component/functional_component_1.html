<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ArcGIS で始める Web マップアプリ開発　コンポーネント編 後半➀</title>

  <style>
    html,
    body {
      padding: 0;
      margin: 0;
      height: 100%;
      width: 100%;
    }
  </style>
  <!-- API キー認証を使用する場合、下記を利用してください -->
  <!-- <script>
    var esriConfig = { apiKey: "YOUR_ACCESS_TOKEN" };
  </script> -->

  <!-- Calcite Design System をロード -->
  <script type="module" src="https://js.arcgis.com/calcite-components/3.2.1/calcite.esm.js"></script>

  <!-- ArcGIS Maps SDK for JavaScript コア API をロード -->
  <script src="https://js.arcgis.com/4.34/"></script>

  <!-- マップ コンポーネントをロード -->
  <script type="module" src="https://js.arcgis.com/4.34/map-components/"></script>

</head>

<body>
  <!-- center と zoom を変更 -->
  <arcgis-map basemap="topo-vector" center="139.74, 35.68" zoom="15">
    <!-- expand コンポーネントを使用 -->
    <arcgis-expand expanded slot="top-left" mode="floating">
      <!-- <arcgis-map> タグ内に <arcgis-print> タグを記述 -->
      <arcgis-print></arcgis-print>
      <!-- <arcgis-print> タグに続けて <arcgis-editor> タグを記述 -->
      <arcgis-editor></arcgis-editor>
    </arcgis-expand>
    <!-- ステップ 4：<arcgis-expand> タグの終わりに続けて <arcgis-sketch> タグを記述 -->
    <arcgis-sketch slot="bottom-right" creation-mode="update" layout="horizontal"></arcgis-sketch>
  </arcgis-map>

  <!-- 編集用のレイヤーを追加するコードを記述 -->
  <script type="module">
    const FeatureLayer = await $arcgis.import("@arcgis/core/layers/FeatureLayer");

    const mapElement = document.querySelector("arcgis-map");
    await mapElement.viewOnReady();

    const demoLyr = new FeatureLayer({
      portalItem: {
        id: "bcbc7432216446cd9a38f6e48324544c"
      }
    });
    mapElement.map.add(demoLyr);
  </script>
</body>

</html>
